<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ISML Mathematics Exhibition 2026–2027</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #09002b, #16005c, #001b44);
      color: white;
      text-align: center;
      overflow-x: hidden;
    }

    .welcome {
      margin: 35px auto 20px;
      padding: 25px;
      width: 90%;
      max-width: 700px;
      border-radius: 25px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(255,255,255,0.15);
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    h2 {
      margin-top: 10px;
      font-size: 20px;
      font-weight: normal;
    }

    .math {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 25px auto;
      width: 90%;
    }

    .badge {
      padding: 12px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.15);
      font-weight: bold;
      animation: float 3s ease-in-out infinite;
    }

    .badge:nth-child(2) {
      animation-delay: 0.5s;
    }

    .badge:nth-child(3) {
      animation-delay: 1s;
    }

    .badge:nth-child(4) {
      animation-delay: 1.5s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    model-viewer {
      width: 90%;
      max-width: 700px;
      height: 450px;
      margin: 20px auto;
      display: block;
      border-radius: 25px;
      background: rgba(255,255,255,0.08);
    }

    #ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: #16005c;
      border: none;
      border-radius: 25px;
      padding: 15px 25px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .note {
      margin: 10px auto 30px;
      width: 90%;
      max-width: 600px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <div class="welcome">
    <h1>WELCOME TO ISML MATHS EXHIBITION</h1>
    <h2>2026 – 2027</h2>
  </div>

  <div class="math">
    <div class="badge">📐 Geometry</div>
    <div class="badge">➗ Fractions</div>
    <div class="badge">📊 Calculus</div>
    <div class="badge">📈 Trigonometry</div>
  </div>

  <model-viewer
    src="https://raw.githubusercontent.com/mikedh/trimesh/main/models/cube.glb"
    alt="3D geometric cube"
    ar
    ar-modes="scene-viewer webxr quick-look"
    ar-scale="fixed"
    camera-controls
    auto-rotate
    rotation-per-second="25deg"
    shadow-intensity="1"
    exposure="1"
    loading="eager"
    touch-action="pan-y">

    <button slot="ar-button" id="ar-button">
      ✦ VIEW CUBE IN YOUR SPACE ✦
    </button>

  </model-viewer>

  <div class="note">
    Explore a 3D geometric cube in Augmented Reality.
  </div>

</body>
</html>
